# Daily AI news ingestion → updates web/data.json → auto-deploys static site
name: Daily AI News Ingest

on:
  schedule:
    # 01:30 UTC = 07:00 IST (India Standard Time)
    - cron: "30 1 * * *"
  workflow_dispatch:  # manual "Run workflow" button

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ingestion/requirements.txt

      - name: Install dependencies
        working-directory: ingestion
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure data directory
        run: mkdir -p ingestion/data

      - name: Ingest RSS feeds
        working-directory: ingestion
        run: python ingest_rss.py --days 14
        continue-on-error: true

      - name: Scrape Anthropic news
        working-directory: ingestion
        run: python scrape_anthropic.py --days 60
        continue-on-error: true

      - name: Fetch article bodies (Anthropic)
        working-directory: ingestion
        run: python fetch_bodies.py --source Anthropic --limit 25
        continue-on-error: true

      - name: Export data.json for website
        working-directory: ingestion
        run: python export_for_web.py --limit 150

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json
          # Also keep a small DB snapshot optional — skip large binary by default
          if git diff --staged --quiet; then
            echo "No data.json changes"
          else
            git commit -m "chore: daily AI news update $(date -u +%Y-%m-%d)"
            git push
          fi
